<!DOCTYPE html>

<html lang="es"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>La Casa de Papel — Puntuación</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;700;900&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --red: #CC0000; --red-dark: #990000;
    --black: #111; --white: #fff;
    --gray-light: #F4F4F2; --gray-mid: #E0DED8; --gray-text: #888;
    --bronze: #8B5E2E; --radius: 10px;
    --D: 'Bebas Neue', Impact, sans-serif;
    --B: 'Barlow', Arial, sans-serif;
  }
  body { background: var(--black); font-family: var(--B); min-height: 100vh; display: flex; justify-content: center; }
  #app { width: 100%; max-width: 900px; min-height: 100vh; background: var(--white); display: flex; flex-direction: column; }
  .header { background: var(--black); padding: 20px 24px 16px; text-align: center; position: relative; }
  .logo { font-family: var(--D); font-size: 48px; letter-spacing: 3px; color: var(--white); line-height: 1; }
  .logo span { background: var(--red); padding: 2px 10px 0; border-radius: 4px; font-size: 42px; margin: 0 4px; display: inline-block; vertical-align: middle; }
  .live { font-family: var(--B); font-size: 11px; letter-spacing: 1px; color: #4caf50; margin-top: 6px; opacity: 0.9; }
  #screen { flex: 1; padding: 24px 24px 48px; }

  /* SETUP */
  .q { font-family: var(--D); font-size: 64px; letter-spacing: 3px; text-align: center; margin-bottom: 32px; line-height: 1; color: var(--black); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 420px; margin: 0 auto; }
  .nbtn { background: var(--gray-light); border: 2px solid var(--gray-mid); border-radius: var(--radius); padding: 22px 0; font-family: var(--D); font-size: 72px; line-height: 1; color: var(--black); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .nbtn:active { background: var(--red); border-color: var(--red); color: var(--white); transform: scale(0.97); }
  .mbtn { grid-column: span 2; background: var(--black); border: 2px solid var(--black); border-radius: var(--radius); padding: 22px 8px; font-family: var(--D); font-size: 34px; letter-spacing: 1px; color: var(--white); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .mbtn:active { background: var(--red); border-color: var(--red); transform: scale(0.97); }

  /* SCORER */
  .backbtn { display: block; width: 100%; margin-bottom: 16px; padding: 12px; background: transparent; border: 1.5px solid var(--gray-mid); border-radius: var(--radius); font-family: var(--B); font-size: 15px; color: var(--gray-text); cursor: pointer; text-align: center; }
  .backbtn:active { background: var(--gray-light); }
  .thead { display: grid; grid-template-columns: 52px 1fr 110px; gap: 10px; padding: 0 10px 10px; border-bottom: 2px solid var(--black); margin-bottom: 12px; }
  .thead span { font-family: var(--D); font-size: 18px; letter-spacing: 1px; color: var(--gray-text); }
  .trow { display: grid; grid-template-columns: 52px 1fr 110px; gap: 10px; align-items: center; padding: 10px; border: 1.5px solid var(--gray-mid); border-radius: var(--radius); margin-bottom: 10px; background: var(--white); }
  .trow:focus-within { border-color: var(--red); }
  .tnum { width: 44px; height: 44px; background: var(--black); color: var(--white); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: var(--D); font-size: 24px; margin: 0 auto; }
  .iname { background: var(--gray-light); border: 1px solid var(--gray-mid); border-radius: 8px; padding: 11px 12px; font-family: var(--D); font-size: 20px; letter-spacing: 1px; color: var(--black); width: 100%; outline: none; text-transform: uppercase; }
  .ibills { background: var(--gray-light); border: 1px solid var(--gray-mid); border-radius: 8px; padding: 11px 12px; font-family: var(--B); font-size: 26px; font-weight: 900; color: var(--black); width: 100%; outline: none; text-align: right; }
  .iname:focus, .ibills:focus { border-color: var(--red); background: var(--white); }
  .iname::placeholder, .ibills::placeholder { color: #bbb; }
  .pbtn { width: 100%; margin-top: 16px; padding: 20px; background: var(--red); color: var(--white); border: none; border-radius: var(--radius); font-family: var(--D); font-size: 34px; letter-spacing: 3px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .pbtn:active { background: var(--red-dark); transform: scale(0.98); }

  /* SECCIÓN TÍTULO */
  .slabel { font-family: var(--D); font-size: 52px; letter-spacing: 3px; color: var(--gray-text); text-align: center; margin-bottom: 20px; }

  /* CLASIFICACIÓN */
  .divider { height: 2px; background: var(--black); margin-bottom: 16px; }
  .rrow { display: grid; grid-template-columns: 70px 78px 1fr 80px; gap: 10px; align-items: center; padding: 12px 10px; border-radius: var(--radius); margin-bottom: 8px; border: 1.5px solid var(--gray-mid); }
  .rrow.r1 { border-color: #b8860b; background: #fff0a0; }
  .rrow.r2 { border-color: #999; background: #e0e0e0; }
  .rrow.r3 { border-color: var(--bronze); background: #ffd9d9; }
  .rpos { font-family: var(--D); font-size: 52px; text-align: center; color: var(--gray-text); line-height: 1; }
  .rpos.p1 { color: #b8860b; }
  .rpos.p2 { color: #555; }
  .rpos.p3 { color: var(--bronze); }
  .rtnum { width: 70px; height: 70px; background: var(--black); color: var(--white); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: var(--D); font-size: 58px; line-height: 1; }
  .rname { font-family: var(--B); font-size: 22px; font-weight: 900; letter-spacing: 0.5px; color: var(--black); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: uppercase; }
  .rbills { font-family: var(--B); font-size: 26px; font-weight: 900; color: var(--black); text-align: right; }
  .backbtn2 { width: 100%; margin-top: 20px; padding: 18px; background: transparent; border: 2px solid var(--black); border-radius: var(--radius); font-family: var(--D); font-size: 28px; letter-spacing: 2px; color: var(--black); cursor: pointer; }
  .backbtn2:active { background: var(--gray-light); }
  .resetbtn { width: 100%; margin-top: 12px; padding: 18px; background: var(--red); border: 2px solid var(--red); border-radius: var(--radius); font-family: var(--D); font-size: 26px; letter-spacing: 2px; color: var(--white); cursor: pointer; }
  .resetbtn:active { background: var(--red-dark); }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="logo">LA CASA <span>DE</span> PAPEL</div>
    <div class="live" id="liveIndicator">● EN VIVO</div>
  </div>
  <div id="screen"><button class="backbtn" onclick="resetSession()">← Cambiar número de equipos</button><div class="thead"><span style="text-align:center">#</span><span>Equipo</span><span style="text-align:right">Billetes</span></div><div id="rowsWrap"><div class="trow" data-num="1"><div style="display:flex;align-items:center;justify-content:center"><div class="tnum">1</div></div><input class="iname" data-num="1" data-type="name" type="text" inputmode="text" autocomplete="off" placeholder="NOMBRE" value=""><input class="ibills" data-num="1" data-type="bills" type="number" inputmode="numeric" pattern="[0-9]*" min="0" placeholder="0" value=""></div><div class="trow" data-num="2"><div style="display:flex;align-items:center;justify-content:center"><div class="tnum">2</div></div><input class="iname" data-num="2" data-type="name" type="text" inputmode="text" autocomplete="off" placeholder="NOMBRE" value=""><input class="ibills" data-num="2" data-type="bills" type="number" inputmode="numeric" pattern="[0-9]*" min="0" placeholder="0" value=""></div><div class="trow" data-num="3"><div style="display:flex;align-items:center;justify-content:center"><div class="tnum">3</div></div><input class="iname" data-num="3" data-type="name" type="text" inputmode="text" autocomplete="off" placeholder="NOMBRE" value=""><input class="ibills" data-num="3" data-type="bills" type="number" inputmode="numeric" pattern="[0-9]*" min="0" placeholder="0" value=""></div><div class="trow" data-num="4"><div style="display:flex;align-items:center;justify-content:center"><div class="tnum">4</div></div><input class="iname" data-num="4" data-type="name" type="text" inputmode="text" autocomplete="off" placeholder="NOMBRE" value=""><input class="ibills" data-num="4" data-type="bills" type="number" inputmode="numeric" pattern="[0-9]*" min="0" placeholder="0" value=""></div></div><button class="pbtn" onclick="goPodium()">VER CLASIFICACIÓN</button></div>
</div>

<!-- Firebase SDK -->
<script src="./index_files/firebase-app-compat.js.descarga"></script>
<script src="./index_files/firebase-database-compat.js.descarga"></script>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyCpH9PQaCWV9lHCbx7wBRTwVzfgaHdmqyE",
  authDomain: "hoja-de-puntuacion-f5268.firebaseapp.com",
  databaseURL: "https://hoja-de-puntuacion-f5268-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "hoja-de-puntuacion-f5268",
  storageBucket: "hoja-de-puntuacion-f5268.firebasestorage.app",
  messagingSenderId: "827563821994",
  appId: "1:827563821994:web:1abffebb7e56319393b9d3"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();
var sessionRef = db.ref('session');

var teams = [];
var currentScreen = 'loading'; // loading | setup | scorer | podium

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ---------- CONEXIÓN EN TIEMPO REAL ---------- */
sessionRef.on('value', function(snapshot){
  var data = snapshot.val();
  document.getElementById('liveIndicator').textContent = '● EN VIVO';

  if(!data || !data.numTeams){
    // No hay sesión activa -> pantalla de inicio
    if(currentScreen !== 'setup'){
      teams = [];
      currentScreen = 'setup';
      renderSetup(false);
    }
    return;
  }

  var n = data.numTeams;

  if(currentScreen === 'setup' || currentScreen === 'loading' || teams.length !== n){
    // (re)construir el array local de equipos
    teams = [];
    for(var i=1;i<=n;i++){
      var rt = data.teams && data.teams[i];
      teams.push({ num:i, name:(rt&&rt.name)||'', bills:(rt&&rt.bills!==undefined?rt.bills:'') });
    }
    currentScreen = 'scorer';
    renderScorerDOM();
    return;
  }

  if(currentScreen === 'scorer'){
    applyRemoteTeams(data.teams||{});
  } else if(currentScreen === 'podium'){
    teams.forEach(function(t){
      var rt = data.teams && data.teams[t.num];
      if(rt){
        t.name = rt.name||'';
        t.bills = rt.bills!==undefined?rt.bills:'';
      }
    });
    renderPodium();
  }
}, function(error){
  document.getElementById('liveIndicator').textContent = '⚠ ERROR DE CONEXIÓN';
  document.getElementById('liveIndicator').style.color = '#ff4444';
  alert('Error de conexión con la base de datos:\n' + error.message + '\n\nCódigo: ' + error.code);
});

/* ---------- PANTALLA SETUP ---------- */
function renderSetup(ext){
  var primary=[4,6,8,10,12], extra=[14,16,18,20,22,24];
  var opts = ext ? extra : primary;
  var btns = opts.map(function(n){ return '<button class="nbtn" onclick="startGame('+n+')">'+n+'</button>'; }).join('');
  var tog = ext
    ? '<button class="mbtn" onclick="renderSetup(false)">← VOLVER</button>'
    : '<button class="mbtn" onclick="renderSetup(true)">MÁS EQUIPOS</button>';
  document.getElementById('screen').innerHTML =
    '<div class="q">¿CUÁNTOS EQUIPOS?</div><div class="grid">'+btns+tog+'</div>';
}

function startGame(n){
  var initTeams = {};
  for(var i=1;i<=n;i++) initTeams[i] = { name:'', bills:'' };
  sessionRef.set({ numTeams: n, teams: initTeams }).catch(function(err){
    alert('No se ha podido crear la partida:\n' + err.message + '\n\nCódigo: ' + err.code);
  });
}

/* ---------- PANTALLA SCORER (marcador) ---------- */
function renderScorerDOM(){
  var rows = teams.map(function(t){
    return '<div class="trow" data-num="'+t.num+'">'+
      '<div style="display:flex;align-items:center;justify-content:center"><div class="tnum">'+t.num+'</div></div>'+
      '<input class="iname" data-num="'+t.num+'" data-type="name" type="text" inputmode="text" autocomplete="off" placeholder="NOMBRE" value="'+esc(t.name)+'">'+
      '<input class="ibills" data-num="'+t.num+'" data-type="bills" type="number" inputmode="numeric" pattern="[0-9]*" min="0" placeholder="0" value="'+esc(t.bills)+'">'+
    '</div>';
  }).join('');

  document.getElementById('screen').innerHTML =
    '<button class="backbtn" onclick="resetSession()">← Cambiar número de equipos</button>'+
    '<div class="thead"><span style="text-align:center">#</span><span>Equipo</span><span style="text-align:right">Billetes</span></div>'+
    '<div id="rowsWrap">'+rows+'</div>'+
    '<button class="pbtn" onclick="goPodium()">VER CLASIFICACIÓN</button>';

  document.getElementById('rowsWrap').addEventListener('input', function(e){
    var num = e.target.getAttribute('data-num');
    var type = e.target.getAttribute('data-type');
    if(!num || !type) return;
    var val = e.target.value;
    if(type === 'name'){
      val = val.toUpperCase();
      e.target.value = val;
    }
    var t = teams.find(function(x){ return x.num === parseInt(num); });
    if(t) t[type] = val;
    sessionRef.child('teams/'+num+'/'+type).set(val);
  });
}

function applyRemoteTeams(remoteTeams){
  teams.forEach(function(t){
    var remote = remoteTeams[t.num];
    if(!remote) return;
    var row = document.querySelector('.trow[data-num="'+t.num+'"]');
    if(!row) return;
    var ni = row.querySelector('.iname');
    var bi = row.querySelector('.ibills');
    if(remote.name !== undefined){
      t.name = remote.name;
      if(ni && document.activeElement !== ni) ni.value = remote.name;
    }
    if(remote.bills !== undefined){
      t.bills = remote.bills;
      if(bi && document.activeElement !== bi) bi.value = remote.bills;
    }
  });
}

function resetSession(){
  if(!confirm('¿Borrar la partida actual para todos y empezar de nuevo?')) return;
  sessionRef.set(null).then(function(){
    // forzamos la transición local también, por si el listener tarda
    teams = [];
    currentScreen = 'setup';
    renderSetup(false);
  }).catch(function(err){
    alert('No se ha podido borrar la partida:\n' + err.message + '\n\nCódigo: ' + err.code);
  });
}

/* ---------- PANTALLA CLASIFICACIÓN ---------- */
function goPodium(){
  currentScreen = 'podium';
  renderPodium();
}

function assignRanks(sorted){
  var ranks = [];
  for(var i=0;i<sorted.length;i++){
    if(i===0){
      ranks.push(1);
    } else {
      var prevBills = parseInt(sorted[i-1].bills)||0;
      var curBills  = parseInt(sorted[i].bills)||0;
      if(prevBills===curBills){
        ranks.push(ranks[i-1]);
      } else {
        ranks.push(ranks[i-1] + 1);
      }
    }
  }
  return ranks;
}

function renderPodium(){
  var sorted = teams.slice().sort(function(a,b){
    return (parseInt(b.bills)||0)-(parseInt(a.bills)||0);
  });
  var ranks = assignRanks(sorted);

  var rankHtml = sorted.map(function(t,i){
    var rank = ranks[i];
    var isTie = ranks.filter(function(r){ return r===rank; }).length > 1;
    var pc = rank===1?'p1':rank===2?'p2':rank===3?'p3':'';
    var rc = rank===1?'r1':rank===2?'r2':rank===3?'r3':'';
    var posLabel = rank+'º';
    var tieTag = isTie ? '<span style="font-family:var(--B);font-size:22px;font-weight:900;background:#f0ad00;color:#fff;border-radius:6px;padding:2px 10px;margin-left:10px;letter-spacing:0.5px;vertical-align:middle">EMPATE</span>' : '';

    return '<div class="rrow '+rc+'">'+
      '<span class="rpos '+pc+'">'+posLabel+'</span>'+
      '<div class="rtnum">'+t.num+'</div>'+
      '<span class="rname">'+(t.name ? esc(t.name) : 'EQUIPO '+t.num)+tieTag+'</span>'+
      '<span class="rbills">'+(parseInt(t.bills)||0)+'</span>'+
    '</div>';
  }).join('');

  document.getElementById('screen').innerHTML =
    '<div class="slabel">CLASIFICACIÓN FINAL</div>'+
    rankHtml+
    '<button class="backbtn2" onclick="backToScorer()">← VOLVER A EDITAR</button>'+
    '<button class="resetbtn" onclick="resetSession()">NUEVA PARTIDA</button>';
}

function backToScorer(){
  currentScreen = 'scorer';
  renderScorerDOM();
}
</script>


</body></html>
